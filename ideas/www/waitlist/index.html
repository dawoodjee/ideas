  /* Container for the entire form */
#mc_embed_shell {
    max-width: 600px; /* Adjust max-width as per your page's content width */

/* Form Heading */
#mc_embed_signup h2 {
    text-align: center;
    color: #222222;
    margin-bottom: 1.8em;
    font-size: 2em; /* Larger heading */
    font-weight: 600; /* Slightly bolder */
}

/* Required fields indicator */
#mc_embed_signup .indicates-required {
    text-align: right;
    font-size: 0.85em;
    color: #777777;
    margin-bottom: 1em;
}

#mc_embed_signup .asterisk {
    color: #e74c3c; /* Standard red for required indicator */
}

/* Grouping for First Name and Last Name (side-by-side) */
#mc_embed_signup .name-fields-group {
    display: flex;
    flex-wrap: wrap; /* Allows fields to stack on smaller screens */
    gap: 1.5em; /* Space between fields */
    margin-bottom: 1em;
}

#mc_embed_signup .name-fields-group .mc-field-group {
    flex: 1 1 calc(50% - 0.75em); /* Each field takes roughly half width, adjusting for gap */
    min-width: 140px; /* Minimum width before stacking */
    margin-bottom: 0; /* Remove default bottom margin as gap handles spacing */
}

/* General field group styling */
#mc_embed_signup .mc-field-group {
    margin-bottom: 1.5em; /* Space between form fields */
}

#mc_embed_signup label {
    display: block; /* Ensures label is on its own line */
    margin-bottom: 0.6em; /* Space between label and input */
    font-weight: 500; /* Slightly bolder labels */
    color: #555555;
    font-size: 0.95em;
}

/* Input field styling (Email, First Name, Last Name, Phone) */
#mc_embed_signup input[type="email"],
#mc_embed_signup input[type="text"] {
    width: 100%;
    padding: 0.9em 1.2em;
    border: 1px solid #dddddd; /* Light gray border */
    border-radius: 6px; /* Slightly rounded input fields */
    font-size: 1em;
    line-height: 1.5;
    color: #333333;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    box-sizing: border-box; /* Include padding and border in element's total width and height */
}

#mc_embed_signup input[type="email"]:focus,
#mc_embed_signup input[type="text"]:focus {
    border-color: #007bff; /* Blue border on focus */
    outline: none; /* Remove default outline */
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2); /* Subtle blue glow on focus */
}

/* Submit Button Styling */
#mc_embed_signup #mc-embedded-subscribe {
    display: block;
    width: 100%;
    padding: 1.1em 1.5em;
    background-color: #007bff; /* Vibrant blue button */
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-size: 1.15em;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.1s ease;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 1.5em; /* Space above the button */
}

#mc_embed_signup #mc-embedded-subscribe:hover {
    background-color: #0056b3; /* Darker blue on hover */
    transform: translateY(-2px); /* Slight lift effect */
}

#mc_embed_signup #mc-embedded-subscribe:active {
    transform: translateY(0); /* Return to original position on click */
}

/* Error and Success Messages */
#mc_embed_signup .response {
    margin-top: 1.5em;
    padding: 1em;
    border-radius: 5px;
    font-size: 0.9em;
    text-align: center;
    line-height: 1.4;
}

#mce-error-response {
    background-color: #ffebeb;
    color: #cc0000;
    border: 1px solid #ffcccc;
}

#mce-success-response {
    background-color: #ebffe0;
    color: #008000;
    border: 1px solid #ccff99;
}

/* Ensure hidden fields remain hidden */
#mc_embed_signup [hidden] {
    display: none !important;
}

/* Responsive adjustments for smaller screens */
@media (max-width: 550px) {
    #mc_embed_shell {
        padding: 1.5em;
        margin: 1em auto;
        border-radius: 0; /* Remove border-radius on very small screens for edge-to-edge look */
        box-shadow: none; /* No shadow */
    }

    #mc_embed_signup h2 {
        font-size: 1.6em; /* Slightly smaller heading on mobile */
    }

    #mc_embed_signup .name-fields-group {
        flex-direction: column; /* Stack fields vertically on small screens */
        gap: 0; /* Remove gap when stacked */
    }

    #mc_embed_signup .name-fields-group .mc-field-group {
        flex: 1 1 100%; /* Each field takes full width */
        margin-bottom: 1.5em; /* Restore vertical spacing when stacked */
    }

    #mc_embed_signup #mc-embedded-subscribe {
        padding: 1em;
        font-size: 1em;
    }
  }
</style>
